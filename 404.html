:root{

@media (prefers-color-scheme:dark){

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{

  font-family:var(--sans); font-size:17px; line-height:1.65;

.wrap{max-width:46rem;margin:0 auto;padding:4rem 1.5rem 6rem}

h3{font-size:1rem;margin:0 0 .3rem;font-weight:650}
p{margin:0 0 1rem}
.lede{font-size:1.12rem;color:var(--fg);margin:0 0 1.4rem}
.handle{font-family:var(--mono);color:var(--muted);font-size:.95rem;margin:0 0 1.6rem}
.links{font-family:var(--mono);font-size:.9rem;display:flex;flex-wrap:wrap;gap:1.1rem;margin:0}
blockquote{
  margin:0 0 .6rem;padding:.9rem 1.1rem;background:var(--quote);
  border-left:2px solid var(--accent);border-radius:0 4px 4px 0;
  font-size:.97rem;color:var(--fg)
}
blockquote p{margin:0}
code,.mono{font-family:var(--mono);font-size:.87em}
code{background:var(--code);padding:.12em .38em;border-radius:3px}
.item{margin:0 0 2rem}
.src{font-family:var(--mono);font-size:.83rem;color:var(--muted);margin:0 0 .5rem}
.note{font-size:.92rem;color:var(--muted);margin:.4rem 0 0}
.grid{display:grid;gap:1.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.2rem}
.card h3{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:.74rem;color:var(--muted);font-weight:400;letter-spacing:.02em}
.card p{margin:.35rem 0 0;font-size:.95rem;color:var(--fg)}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:.42rem 0;border-bottom:1px solid var(--line);font-size:.95rem;
  display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap}
ul.plain li:last-child{border-bottom:0}
ul.plain .repo{font-family:var(--mono);font-size:.87rem;min-width:15rem;flex-shrink:0}
ul.plain .what{color:var(--muted);font-size:.92rem}
footer{margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:.86rem;color:var(--muted)}
@media(max-width:34rem){
  .wrap{padding:2.5rem 1.15rem 4rem}
  h1{font-size:1.6rem}
  ul.plain .repo{min-width:100%}
}

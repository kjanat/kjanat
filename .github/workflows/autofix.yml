# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: autofix
on:
  schedule: [cron: "0 8 * * *"]
  push: { branches: ["master"] }
  workflow_dispatch:
concurrency: { group: "autofix-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

env:
  BRANCH: autofix/dprint

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.actor == github.repository_owner || contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) }}
    permissions:
      contents: write # push the autofix branch
      pull-requests: write # open or update the autofix PR
      id-token: write # mint the OIDC token the signing service authenticates
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: kjanat/install-dprint@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "just,tombi,rust+rustfmt" }
      - timeout-minutes: 2
        run: bash .github/scripts/dprint-update.sh

      - run: dprint fmt --allow-no-files --diff --excludes .github
      - run: bash .github/scripts/dprint-sort.sh

      # Formatting drift is the normal state, not a failure: it opens a PR
      # rather than failing the run or pushing straight to master.
      - id: drift
        run: |
          if git diff --quiet; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no formatting drift"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            git diff --stat | tail -1
          fi

      # The signing service is reachable only from a run that can mint an OIDC
      # token for it. Without the vars there is nothing to call, so the PR
      # still opens - unsigned - instead of failing the run.
      - name: check signing config
        id: signing
        if: steps.drift.outputs.found == 'true'
        env:
          URL: ${{ vars.SIGNING_SERVICE_URL }}
          KEY: ${{ vars.SIGNING_SERVICE_KEY_ID }}
        run: |
          if [[ -n "${URL}" && -n "${KEY}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNING_SERVICE_URL or SIGNING_SERVICE_KEY_ID unset; opening the PR unsigned"
          fi

      - name: install signing client
        if: steps.drift.outputs.found == 'true' && steps.signing.outputs.configured == 'true'
        uses: kjanat/gpg-signing-service@cbcb8600547bd6799cdca0b339e8dad044481435
        with: { version: v1.1.2 }

      - name: mint OIDC token
        id: oidc
        if: steps.drift.outputs.found == 'true' && steps.signing.outputs.configured == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const token = await core.getIDToken('gpg-signing-service');
            core.setSecret(token);
            core.setOutput('token', token);

      # Sign everything, always: commits, amends (commit.gpgsign covers both),
      # tags, and signed pushes. gpg.program routes git's signing calls to the
      # service, so nothing this job creates can be left unsigned by accident.
      - name: configure git to sign everything
        if: steps.drift.outputs.found == 'true' && steps.signing.outputs.configured == 'true'
        env:
          GPG_SIGN_URL: ${{ vars.SIGNING_SERVICE_URL }}
          GPG_SIGN_KEY_ID: ${{ vars.SIGNING_SERVICE_KEY_ID }}
          GPG_SIGN_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          {
            echo "GPG_SIGN_URL=${GPG_SIGN_URL}"
            echo "GPG_SIGN_KEY_ID=${GPG_SIGN_KEY_ID}"
            echo "GPG_SIGN_TOKEN=${GPG_SIGN_TOKEN}"
          } >> "$GITHUB_ENV"

          git config --global gpg.format openpgp
          git config --global gpg.program "${GITHUB_WORKSPACE}/.github/actions/sign-commits/git-gpg-shim.sh"
          git config --global user.signingkey "${GPG_SIGN_KEY_ID}"
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true
          git config --global push.gpgSign if-asked

      - name: commit fixes
        if: steps.drift.outputs.found == 'true'
        run: |
          git config --global user.name "Kaj Kowalski"
          git config --global user.email "info@kajkowalski.nl"
          git checkout -B "${BRANCH}"
          # A signing refusal must not strand the fixes: fall back to an
          # unsigned commit and say so, rather than failing the run.
          if ! git commit -am "style: apply dprint formatting"; then
            echo "::warning::signed commit failed; retrying unsigned"
            git commit --no-gpg-sign -am "style: apply dprint formatting"
          fi
          git log -1 --format='%h %an <%ae> signature=%G?'

      - name: push branch
        if: steps.drift.outputs.found == 'true'
        run: git push origin "HEAD:refs/heads/${BRANCH}" --force-with-lease

      - name: open or update pull request
        if: steps.drift.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          existing="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "::notice::refreshed existing PR #${existing}"
          else
            gh pr create \
              --base "${BASE}" \
              --head "${BRANCH}" \
              --title "style: apply dprint formatting" \
              --body "Formatting drift picked up by the scheduled \`dprint fmt\` run. Merge or close; the branch is force-updated on each run." \
              || echo "::warning::branch pushed but PR not opened - enable Settings > Actions > 'Allow GitHub Actions to create and approve pull requests'"
          fi

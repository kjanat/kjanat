# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: autofix
on:
  schedule: [cron: "0 8 * * *"]
  push: { branches: [master] }
  workflow_dispatch:
concurrency: autofix/dprint
permissions: { contents: read }

jobs:
  autofix:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: kjanat/mise-action@v6
      - cancel-timeout-minutes: 5
        run: mise run "kprint:update"
        continue-on-error: true
      - run: mise run "fmt:autofix"

      # Formatting drift is the normal state, not a failure: it opens a PR
      # rather than failing the run or pushing straight to master.
      - uses: kjanat/beepboop/actions/pull-request@v1
        with:
          branch: autofix/dprint
          commit-message: "chore: sync dprint configs, schema, and formatting"
          title: "chore: sync dprint configs, schema, and formatting"
          body: Shared plugin updates, their generated schema, and formatting drift picked up after master changes or by the daily run. Merge or close; the branch is force-updated on each run.

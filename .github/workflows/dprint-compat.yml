# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: formatter compatibility
on:
  pull_request:
    paths:
      - configs/**
      - schemas/**
      - '**/*print.toml'
      - '**/*print.json'
      - '**/*print.jsonc'
      - .github/scripts/dprint-schema.sh
      - .github/workflows/dprint-compat.yml
  workflow_dispatch:
concurrency: { group: "dprint-compat-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  schema:
    name: generate shared schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: formatter
        uses: kjanat/dprint-check@v3.2
        with: { install-only: true }
      # Missing plugin schemas must fail here, before dependency updates merge.
      - run: bash .github/scripts/dprint-schema.sh
        env: { DPRINT: "${{ steps.formatter.outputs.location }}" }

  consumers:
    name: ${{ matrix.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repository:
          - kjanat/actionlint-plugin-ruff
          - kjanat/actionlint-plugin-shellcheck
          - kjanat/actionlint-registry
          - kjanat/beepboop
          - kjanat/fujo
          - kjanat/shellcheck-rs
          - kjanat/tree-sitter-ldap-schema
          - kjanat/tree-sitter-ldif
          - kjanat/vw
          - kjanat/zed-ldap
    steps:
      - uses: actions/checkout@v7
        with: { path: shared }
      - uses: actions/checkout@v7
        with: { repository: "${{ matrix.repository }}", path: consumer }
      - id: formatter
        uses: kjanat/dprint-check@v3.2
        with: { install-only: true }

      - name: point the consumer at this revision of the shared configs
        working-directory: consumer
        run: |
          revision="$(git -C "${GITHUB_WORKSPACE}/shared" rev-parse HEAD)"
          # Keep remote configs remote: relative extends, plugin URLs and
          # configFile paths must resolve against this revision's URL.
          shared="https://raw.githubusercontent.com/kjanat/kjanat/${revision}/configs/"
          found=0
          for file in {,.}{k,d}print.{toml,json,jsonc} .config/{k,d}print.{toml,json,jsonc}; do
            [[ -f "${file}" ]] || continue
            sed -i -E "s#https://raw\.githubusercontent\.com/kjanat/kjanat/[^\"' ]*/configs/#${shared}#g" "${file}"
            git diff --stat -- "${file}"
            found=1
          done
          if [[ "${found}" == 0 ]]; then
            echo "::error::${{ matrix.repository }} has no dprint or kprint config at its root or in .config"
            exit 1
          fi

      # Resolving the config initializes every plugin with the consumer's
      # options and formats nothing, so drift and missing external formatters
      # cannot fail it. An invalid option value or a plugin that will not load
      # makes every format run in that repository fail.
      - name: load every plugin with the consumer's options
        working-directory: consumer
        env: { FORMATTER: "${{ steps.formatter.outputs.location }}" }
        run: |
          # Use the installed executable's discovery and precedence rules.
          "${FORMATTER}" output-resolved-config > "${RUNNER_TEMP}/resolved-config.json"
          wc -l "${RUNNER_TEMP}/resolved-config.json"
